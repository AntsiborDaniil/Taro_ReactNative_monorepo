# Применяет миграции и деплоит Edge Functions в Supabase Cloud.
# Secrets в GitHub: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF

name: Supabase Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'supabase/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy interpret --no-verify-jwt
          supabase functions deploy motivation-mood --no-verify-jwt
          supabase functions deploy motivation-habits --no-verify-jwt
