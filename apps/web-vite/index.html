    <!--
      Критический boot-splash: рисуется до JS/CSS-модулей, чтобы не было
      пустого #root и вспышки белого. Снимается из main.tsx после первого рендера.
      Цвета = DS ground/calm/accent/ink (hardcode: токены ещё не загружены).
    -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #091519;
        color: #ecedcb;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top, 0px))
          max(24px, env(safe-area-inset-right, 0px))
          max(24px, env(safe-area-inset-bottom, 0px))
          max(24px, env(safe-area-inset-left, 0px));
        background:
          radial-gradient(ellipse 80% 55% at 50% 18%, rgba(44, 142, 158, 0.28), transparent 62%),
          radial-gradient(ellipse 70% 50% at 82% 88%, rgba(234, 164, 51, 0.1), transparent 55%),
          radial-gradient(ellipse 55% 40% at 12% 78%, rgba(32, 106, 117, 0.22), transparent 50%),
          #091519;
        transition: opacity 0.42s ease, visibility 0.42s ease;
      }

      #boot-splash.boot-splash--out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #boot-splash .boot-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
        max-width: 280px;
      }

      #boot-splash .boot-orb {
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(44, 142, 158, 0.35), transparent 70%);
        filter: blur(8px);
        animation: bootPulse 2.4s ease-in-out infinite;
        pointer-events: none;
      }

      #boot-splash .boot-mark {
        position: relative;
        width: 72px;
        height: 112px;
        border-radius: 12px 12px 18px 18px;
        border: 1px solid rgba(44, 142, 158, 0.55);
        background:
          linear-gradient(160deg, rgba(32, 106, 117, 0.45), rgba(15, 34, 40, 0.9) 55%, rgba(9, 21, 25, 0.95)),
          #0f2228;
        box-shadow:
          0 0 0 1px rgba(234, 164, 51, 0.12),
          0 18px 40px rgba(0, 0, 0, 0.35);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      #boot-splash .boot-mark::before {
        content: '';
        position: absolute;
        inset: 8px;
        border-radius: 8px 8px 12px 12px;
        border: 1px solid rgba(218, 219, 188, 0.12);
        pointer-events: none;
      }

      #boot-splash .boot-mark svg {
        width: 28px;
        height: 28px;
        color: #eaa433;
        opacity: 0.95;
        animation: bootGlow 2.4s ease-in-out infinite;
      }

      #boot-splash .boot-brand {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 34px;
        line-height: 1.05;
        letter-spacing: -0.04em;
        font-weight: 800;
        color: #ecedcb;
      }

      #boot-splash .boot-sub {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        font-size: 13px;
        line-height: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #dadbbc;
        opacity: 0.72;
      }

      #boot-splash .boot-segments {
        display: flex;
        gap: 4px;
        margin-top: 4px;
      }

      #boot-splash .boot-segments span {
        width: 22px;
        height: 3px;
        border-radius: 2px;
        background: #eaa433;
        opacity: 0.28;
        animation: bootSeg 1.2s ease-in-out infinite;
      }

      #boot-splash .boot-segments span:nth-child(2) {
        animation-delay: 0.15s;
      }
      #boot-splash .boot-segments span:nth-child(3) {
        animation-delay: 0.3s;
      }
      #boot-splash .boot-segments span:nth-child(4) {
        animation-delay: 0.45s;
      }
      #boot-splash .boot-segments span:nth-child(5) {
        animation-delay: 0.6s;
      }

      @keyframes bootPulse {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }

      @keyframes bootGlow {
        0%,
        100% {
          opacity: 0.7;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes bootSeg {
        0%,
        100% {
          opacity: 0.28;
        }
        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-orb,
        #boot-splash .boot-mark svg,
        #boot-splash .boot-segments span {
          animation: none;
        }
        #boot-splash .boot-segments span {
          opacity: 0.55;
        }
        #boot-splash {
          transition: none;
        }
      }
    </style>
