<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var lng = 'ru';
        try {
          if (localStorage.getItem('languageManual') === '1') {
            lng = localStorage.getItem('language') || 'ru';
          } else {
            var fromUrl = new URLSearchParams(location.search).get('lang');
            if (fromUrl === 'en' || fromUrl === 'ru') lng = fromUrl;
          }
        } catch (e) {}
        var en = lng === 'en';
        // Тема до отрисовки splash (ключ 'theme', как shared/lib/theme.ts).
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          if (theme === 'light') document.documentElement.dataset.theme = 'light';
        } catch (e) {}
        document.documentElement.lang = en ? 'en' : 'ru';
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <meta name="theme-color" content="#091519" />
    <script>
      try {
        if (document.documentElement.dataset.theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f2f1e3');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Mindful — Таро онлайн: расклады, карта дня, значения карт</title>
    <meta
      id="app-meta-description"
      name="description"
      content="Онлайн-таро: расклады, карта дня, толкования карт и история гаданий. Бесплатно в тестовом режиме — войдите в аккаунт, чтобы сохранять расклады и избранное."
    />
    <meta
      name="keywords"
      content="таро, таро онлайн, расклад таро, гадание на таро, карты таро, карта дня таро, значение карт таро, tarot, tarot online, tarot reading, daily tarot card, tarot spreads, mindful tarot"
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mindful Tarot" />
    <meta id="app-og-title" property="og:title" content="Mindful — Таро онлайн: расклады, карта дня, значения карт" />
    <meta
      id="app-og-description"
      property="og:description"
      content="Онлайн-таро: расклады, карта дня, толкования карт и история гаданий. Бесплатно в тестовом режиме — войдите в аккаунт, чтобы сохранять расклады и избранное."
    />
    <meta id="app-og-locale" property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta id="app-twitter-title" name="twitter:title" content="Mindful — Таро онлайн: расклады, карта дня, значения карт" />
    <meta
      id="app-twitter-description"
      name="twitter:description"
      content="Онлайн-таро: расклады, карта дня, толкования карт и история гаданий. Бесплатно в тестовом режиме — войдите в аккаунт, чтобы сохранять расклады и избранное."
    />
    <!-- canonical и og:url подставляет scripts/inject-seo-html.mjs после сборки (WEB_APP_URL). -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <!--
      Критический boot-splash: рисуется до JS-модулей, чтобы не было пустого #root
      и вспышки белого. Стили, токены и шрифты DS — src/styles/boot.css (Vite кладёт
      его в <head> и подставляет пути к шрифтам). Снимается из main.tsx после первого рендера.
    -->
    <link rel="stylesheet" href="/src/styles/boot.css" />
  </head>
  <body>
    <noscript><div><img src="https://mc.yandex.ru/watch/112263887" style="position: absolute; left: -9999px" alt="" /></div></noscript>
    <div id="boot-splash" role="status" aria-live="polite" aria-busy="true">
      <div class="boot-inner">
        <div class="boot-card" aria-hidden="true">
          <img src="./assets/images/core/cardBack.webp" alt="" width="84" height="149" fetchpriority="high" />
        </div>
        <div class="boot-text">
          <p class="boot-brand">Mindful Tarot</p>
          <p class="boot-sub">Загрузка</p>
        </div>
        <div class="boot-segments" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <script>
      // Подпись splash по языку — здесь, а не в <head>: там #boot-splash ещё не существует.
      (function () {
        var sub = document.querySelector('#boot-splash .boot-sub');
        if (sub && document.documentElement.lang === 'en') sub.textContent = 'Loading';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
